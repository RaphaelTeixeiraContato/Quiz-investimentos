<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080314">
  <title>Be Invest - Quiz sobre Investimentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body {
      background-color: #080314 !important;
      color-scheme: dark;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      padding: 2rem 1.5rem;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Fundo escurecido e refinado com grade geométrica suave */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: #05020c;
      background-image:
        radial-gradient(ellipse 75% 55% at 50% 15%, rgba(124, 58, 237, 0.22) 0%, rgba(76, 29, 149, 0.12) 45%, transparent 75%),
        radial-gradient(ellipse 65% 45% at 50% 95%, rgba(109, 40, 217, 0.16) 0%, rgba(59, 7, 100, 0.08) 50%, transparent 80%),
        radial-gradient(circle at 10% 80%, rgba(147, 51, 234, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 90% 20%, rgba(79, 70, 229, 0.10) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 48px 48px, 48px 48px;
    }

    /* Orbes de luz roxa suave e profundas */
    .bg i {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.22;
      pointer-events: none;
    }
    .bg i:nth-child(1) {
      width: 50vmax;
      height: 38vmax;
      background: radial-gradient(circle, #6b21a8 0%, #4c1d95 70%);
      top: -10vmax;
      left: 10%;
      animation: movePurple1 28s ease-in-out infinite alternate;
    }
    .bg i:nth-child(2) {
      width: 42vmax;
      height: 42vmax;
      background: radial-gradient(circle, #4338ca 0%, #3b0764 70%);
      bottom: -15vmax;
      right: -5vmax;
      opacity: 0.18;
      animation: movePurple2 34s ease-in-out infinite alternate;
    }
    .bg i:nth-child(3) {
      width: 35vmax;
      height: 35vmax;
      background: radial-gradient(circle, #7e22ce 0%, #581c87 70%);
      top: 30%;
      left: 40%;
      opacity: 0.18;
      animation: movePurple3 24s ease-in-out infinite alternate;
    }

    .hero-brand, .roles-grid {
      position: relative;
      z-index: 2;
    }

    .hero-brand {
      margin-bottom: clamp(1.8rem, 4vh, 3rem);
      animation: fadeUp 0.6s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-logo {
      width: clamp(65px, 8vw, 85px);
      height: clamp(65px, 8vw, 85px);
      margin-bottom: 1.2rem;
      border-radius: 25%;
      object-fit: cover;
      box-shadow: 0 8px 30px rgba(138, 43, 226, 0.55);
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.3s ease;
    }
    .main-logo:hover {
      transform: scale(1.05);
    }
    .hero-brand .brand-name {
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
    }
    .hero-brand .sub-tag {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: #c084fc;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.95;
      text-shadow: 0 2px 10px rgba(138, 43, 226, 0.3);
    }
    
    .roles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: clamp(1.5rem, 3.5vw, 2.8rem);
      width: 100%;
      max-width: 680px;
    }
    
    .role-card {
      background: rgba(18, 10, 32, 0.78);
      border: 1.5px solid rgba(168, 85, 247, 0.35);
      border-radius: 1.5rem;
      padding: clamp(2rem, 4.5vh, 3.2rem) 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  border-color 0.25s ease,
                  box-shadow 0.25s ease,
                  opacity 0.25s ease,
                  filter 0.25s ease,
                  background 0.25s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.15);
      animation: fadeUp 0.6s ease 0.2s both;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .role-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(168, 85, 247, 0.25) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .role-card:nth-child(2) {
      animation-delay: 0.3s;
    }
    
    .role-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: rgba(192, 132, 252, 0.9);
      box-shadow: 0 22px 50px rgba(138, 43, 226, 0.4), inset 0 0 30px rgba(138, 43, 226, 0.2);
      background: rgba(26, 12, 46, 0.9);
    }
    .role-card:hover::before {
      opacity: 1;
    }

    /* Estado ativo ao clicar (micro-animação de clique sem travar a tela) */
    .role-card.selected {
      transform: scale(1.05) translateY(-8px) !important;
      border-color: #00f5d4 !important;
      box-shadow: 0 0 40px rgba(0, 245, 212, 0.55), 0 15px 45px rgba(0, 0, 0, 0.8) !important;
      background: rgba(24, 12, 44, 0.95) !important;
    }
    .role-card.dimmed {
      opacity: 0.45 !important;
      transform: scale(0.97) !important;
      filter: blur(1px) !important;
    }
    
    .role-icon {
      font-size: clamp(3.8rem, 7vw, 5rem);
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 4px 12px rgba(138, 43, 226, 0.5));
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .role-card:hover .role-icon {
      transform: scale(1.15) rotate(-6deg);
    }
    .role-card.selected .role-icon {
      transform: scale(1.2) rotate(4deg);
    }
    
    .role-title {
      font-size: clamp(1.6rem, 3.2vw, 2.1rem);
      font-weight: 800;
      color: #fff;
      margin-bottom: 0;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="bg"><i></i><i></i><i></i></div>

  <div class="hero-brand">
    <img src="/favicon.ico" class="main-logo" alt="Be Invest Logo">
    <h1 class="brand-name">Be Invest</h1>
    <div class="sub-tag">Quiz sobre investimentos</div>
  </div>

  <div class="roles-grid">
    <a href="/player" class="role-card">
      <div class="role-icon">🎮</div>
      <h2 class="role-title">Jogadores</h2>
    </a>
    
    <a href="/host" class="role-card">
      <div class="role-icon">📺</div>
      <h2 class="role-title">Apresentador</h2>
    </a>
  </div>

  <script>
    const cards = document.querySelectorAll('.role-card');
    let isNavigating = false;

    // Reseta completamente o estado dos cards
    function resetRoleCards() {
      isNavigating = false;
      cards.forEach(c => {
        c.classList.remove('selected', 'dimmed');
      });
    }

    // Garante restauração limpa ao voltar pelo navegador (bfcache)
    window.addEventListener('pageshow', resetRoleCards);
    window.addEventListener('pagehide', resetRoleCards);
    window.addEventListener('popstate', resetRoleCards);
    window.addEventListener('beforeunload', resetRoleCards);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resetRoleCards();
    });
    window.addEventListener('focus', resetRoleCards);

    // Estado inicial limpo
    resetRoleCards();

    cards.forEach(card => {
      card.addEventListener('click', e => {
        e.preventDefault();
        if (isNavigating) return;
        isNavigating = true;

        const targetUrl = card.getAttribute('href');

        // Feedback visual imediato no card clicado
        card.classList.add('selected');
        cards.forEach(c => {
          if (c !== card) c.classList.add('dimmed');
        });

        // Navegação rápida e fluida sem tela preta
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 180);

        // Timer de resguardo: se o usuário voltar ou a navegação for abortada, restaura em 600ms
        setTimeout(resetRoleCards, 600);
      });
    });
  </script>
  <script src="/common.js"></script>
</body>
</html>
